allowBuilds:
  unrs-resolver: true

# Security overrides for transitive build tooling whose parents still pin a
# vulnerable version. Drop an entry once the parent ships a range with the fix.
overrides:
  # sockjs/jest-junit/spfx-heft-plugins pin uuid 8/9, which have no backported
  # fix for the v3/v5/v6 buf bounds check - all three use only the v1/v4 named
  # exports, which uuid 11 still provides
  uuid: ^11.1.1
  # express@4 pins qs 6.14.2 exactly - stringify DoS, bracket-key array-limit
  # bypass and isBuffer DoS
  qs: ^6.16.0
  # sp-css-loader uses postcss-selector-parser 6.x, which has no fix for the
  # quadratic flat-selector parsing; 7.x builds a byte-identical bundle
  postcss-selector-parser@6: ^7.1.6
  serialize-javascript: ^7.1.3 # XSS via unescaped </script
  # node-forge 1.4.0 (via the rig's dev-server cert tooling) has no patched
  # release yet for the PKCS#1 v1.5 DigestAlgorithm advisory (fix: >=1.4.1).
  # Add `node-forge: ^1.4.1` once it is published.
