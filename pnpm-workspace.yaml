# pnpm 11 reads build-script settings from this file (no longer package.json).
# unrs-resolver ships a native binding built via a postinstall script; allow it so
# `pnpm install` exits cleanly (Heft runs an install check before every build).
allowBuilds:
  unrs-resolver: true

# Security overrides for transitive dependencies whose parents pin a vulnerable
# version, so `pnpm update` cannot reach the patch on its own. All are dev-scope
# build tooling. Drop an entry once the parent ships a range that allows the fix.
overrides:
  # ajv@8 pins fast-uri 3.1.2 - GHSA host confusion via backslash authority
  # delimiter and failed IDN canonicalization; 3.1.5 closes the follow-up
  # CVE-2026-18446 (`\\`, `/\`, `\/` authority introducers); 3.1.9 closes the
  # scheme-relative IDN, malformed-IPv6 SSRF and related follow-ups
  fast-uri: ^3.1.9
  # postcss-svgo@5 pins svgo 2.8.2 - removeScripts plugin leaves some
  # executable scripts intact; 2.8.4 closes the namespace/control-character
  # and foreignObject bypasses
  svgo: ^2.8.4
  # express@4 pins qs 6.14.2 exactly - qs.stringify DoS on null entries in
  # comma-format arrays; 6.16.0 closes the bracket-key array-limit bypass and
  # isBuffer DoS
  qs: ^6.16.0
  # sockjs/jest-junit/spfx-heft-plugins pin uuid 8/9, which have no backported
  # fix for the v3/v5/v6 buf bounds check - all three use only the v1/v4 named
  # exports, which uuid 11 still provides
  uuid: ^11.1.1
  # brace-expansion DoS via unbounded intermediate arrays. Pinned per major
  # line, not to 5.x: brace-expansion 5 exports { expand } while minimatch 3
  # calls the module itself as a function, so a blanket `^5` override makes any
  # glob containing `{}` throw "expand is not a function". Upstream backported
  # the fix to every line, so each stays on its own API.
  # 1.1.21 / 2.1.7 / 5.0.12 close the follow-up `{a},b}` quadratic rewrite and
  # nested-group recursion DoS.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  # Pulled in by the SPFx rig / heft plugins (webpack-dev-server, express,
  # postcss, eslint) at exact or patch-capped versions that predate the fix.
  # Each override stays on the installed major line, except where noted.
  # js-yaml: quadratic CPU in !!omap resolution and merge-key limits (3.x and 4.x)
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  # postcss-selector-parser: quadratic flat-selector parsing. No 6.x fix, so
  # sp-css-loader's 6.x copy is lifted to 7.x - verified the built bundle is
  # byte-identical to the 6.1.5 build.
  postcss-selector-parser@6: ^7.1.6
  postcss-selector-parser@7: ^7.1.6
  nanoid@3: ^3.3.18 # infinite loop on size 0 with custom generators
  browserslist: ^4.28.7 # unbounded cache growth; stats-file prototype write
  colord: ^2.9.4 # slow rejection of oversized color strings
  baseline-browser-mapping: ^2.11.0 # process exit on invalid input
  source-map-js: ^1.2.2 # event-loop DoS via section offsets
  proxy-addr: ^2.0.8 # IP spoofing via IPv4-mapped IPv6 trust subnet
  compression: ^1.8.2 # memory leak on premature response close
  shell-quote: ^1.11.0 # quote() command injection via line terminator
  follow-redirects: ^1.16.1 # cross-origin credential header leaks
  launch-editor: ^2.14.2 # Windows arg escaping / editor flag injection
  body-parser@1: ^1.20.9 # DoS via trailing bytes after compressed body
  serialize-javascript: ^7.1.3 # XSS via unescaped </script
  # node-forge 1.4.0 (via the rig's dev-server cert tooling) has no patched
  # release yet for the PKCS#1 v1.5 DigestAlgorithm advisory (fix: >=1.4.1).
  # Add `node-forge: ^1.4.1` once it is published.
